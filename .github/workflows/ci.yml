name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: flashcards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d flashcards_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/flashcards_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest-cov

      - name: Run tests
        run: >
          python -m pytest tests -q
          --cov=backend.app
          --cov-report=term-missing

      - name: Verify Docker build
        run: docker build -t flashcards:ci .